name: Compila APK

on:
  push:
    branches: [ main, prova-app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Controllo del codice (anche senza chiave)
        run: gradle :app:compileReleaseJavaWithJavac --stacktrace

      - name: Chiave di firma (cifrata nel progetto, si apre con il secret KEYSTORE_PASSWORD)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Manca il secret KEYSTORE_PASSWORD"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in app/firma.keystore.enc -out app/firma.keystore -pass env:KEYSTORE_PASSWORD \
            || { echo "::error::La password KEYSTORE_PASSWORD non apre la chiave: ricopiala"; exit 1; }

      - name: Compila
        env:
          KEYSTORE_FILE: firma.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepara APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk BolletteDiCasa.apk
          rm -f app/firma.keystore

      - name: Allega ai risultati della build
        uses: actions/upload-artifact@v4
        with:
          name: BolletteDiCasa-apk
          path: BolletteDiCasa.apk

      - name: Pubblica come ultima versione
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versione
          name: Ultima versione
          body: |
            Bollette di casa per Android.
            Per installarla scarica BolletteDiCasa.apk dal telefono e aprilo.
          make_latest: true
          files: BolletteDiCasa.apk
