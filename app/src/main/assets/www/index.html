<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bollette di casa</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#eceef0; --card:#fff; --text:#1d2530; --muted:#6b7480; --line:#dde2e8;
  --accent:#0F766E; --accent-soft:rgba(20,184,166,.15);
  --ok:#16a34a; --ok-soft:#e7f6ec; --warn:#d97706; --warn-soft:#fdf1e2; --bad:#dc2626; --bad-soft:#fde8e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#1a1a1a;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;min-height:62px}
header .back{flex:none;border:0;background:#333;color:#fff;font:inherit;font-size:16px;border-radius:10px;padding:8px 14px;white-space:nowrap}
header .back:active{background:#444}
header h1{flex:1;margin:0;font-size:20px;font-weight:500;letter-spacing:.2px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
header .hdate{color:#9a9a9a;font-size:14px;white-space:nowrap}
header.sub .hdate{font-size:12.5px;white-space:normal;text-align:right;max-width:76px;line-height:1.25}
header.sub h1{font-size:18.5px}
.statusbar{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12.5px;color:#555;background:#f6f7f8;border-bottom:1px solid var(--line);flex-wrap:wrap}
.statusbar .st{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 11px;min-width:0;max-width:100%}
.statusbar .st span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* home a schede */
.hero{text-align:center;padding:14px 6px 22px;color:#666}
.hero .day{font-size:18px;color:#555;margin-bottom:8px}
.hero .sum{font-size:14.5px;line-height:1.75}
.hero .sum b{color:#1d2530;font-weight:500}
.hero .sum a{color:inherit;text-decoration:none}
.tile{display:flex;align-items:center;gap:18px;background:#fff;border:1.5px solid #dcdcdc;border-radius:20px;padding:22px 20px;margin-bottom:14px;cursor:pointer}
.tile:active{background:#f5f6f7}
.tile .ic{width:58px;height:58px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.tile .tx{flex:1;min-width:0}
.tile .t1{font-size:19px;color:#1d2530;margin-bottom:2px}
.tile .t2{font-size:14px;color:#777}
.tile .chev{color:#b5b5b5;font-size:22px}
.tile .cnt{background:var(--warn);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;margin-left:6px;vertical-align:3px}
.scelta{display:flex;align-items:center;gap:14px;border:1.5px solid #dcdcdc;border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;background:#fff}
.scelta .ic{width:48px;height:48px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
.scelta .tx{flex:1;min-width:0} .scelta .t1{font-size:16.5px;color:#1d2530} .scelta .t2{font-size:13px;color:#777}
.scelta .rd{width:22px;height:22px;border-radius:50%;border:2px solid #c3c7cc;flex:none}
.scelta.off{opacity:.55}
.presto{font-size:11px;font-weight:600;background:#eef0f3;color:#6b7480;border-radius:99px;padding:2px 8px;vertical-align:2px;margin-left:4px}
.scelta.on{border-color:#1a1a1a;box-shadow:inset 0 0 0 1px #1a1a1a}
.scelta.on .rd{border:7px solid #1a1a1a}
.koline{background:var(--bad-soft);color:#991b1b;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px;white-space:pre-line;word-break:break-word}
.okline{background:var(--ok-soft);color:#166534;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.card.fcard{padding:0;overflow:hidden}
.fhead{padding:16px 18px;font-size:17px;font-weight:500;border-bottom:1px solid #ececec}
.fbody{padding:6px 18px 18px}
.fbody label{font-size:14px;color:#666;margin:12px 0 6px}
.fbody select,.fbody input{border:1.5px solid #d6d6d0;border-radius:12px;padding:12px 14px;font-size:16px;background:#fff}
.fbtns{display:flex;gap:10px;margin-top:14px}
.fbtns button{font:inherit;font-size:16px;border-radius:12px;padding:10px 20px}
.bk{background:#1a1a1a;color:#fff;border:1.5px solid #1a1a1a}
.bw{background:#fff;color:#1d2530;border:1.5px solid #d6d6d0}
.periodo{margin:0 6px 12px;color:#555;font-size:14.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid #dcdcdc;background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;color:#444}
.chip.on{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1.5px solid #dcdcdc;border-radius:16px;padding:12px 10px;text-align:center}
.kpi.wide{grid-column:1 / -1}
.kpi .kv{font-size:20px;font-weight:600;color:#1d2530}
.kpi.wide .kv{font-size:28px}
.kpi .kl{font-size:12.5px;color:#777}
.hb{padding:7px 0;cursor:pointer}
.hbl{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#333}
.hbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbl b{font-weight:600;white-space:nowrap}
.hbt{height:10px;background:#f0f1f3;border-radius:4px;margin-top:4px}
.hbf{height:100%;background:#0F766E;border-radius:4px}
.hbf.alt{background:#9aa3ad}
.hb.sel .hbf{background:#115e59}
.hbn{font-size:12px;color:#888;margin-top:2px}
.vb{display:flex;align-items:flex-end;gap:4px;height:170px;margin-top:8px;border-bottom:1px solid #e3e5e8}
.vbc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;min-width:0}
.vbt{flex:1;display:flex;align-items:flex-end}
.vbf{width:100%;background:#0F766E;border-radius:4px 4px 0 0}
.vbc.sel .vbf{background:#115e59}
.vb.fitto{gap:1px} .vb.fitto .vbk{font-size:10px;overflow:visible}
.vbk{font-size:11px;color:#777;text-align:center;padding-top:4px;white-space:nowrap;overflow:hidden}
.tip{font-size:13.5px;color:#555;background:#f6f7f8;border-radius:8px;padding:8px 10px}
.stat{cursor:pointer}
.stat:active{background:#f5f6f7}
.stat.sel{border-color:#1a1a1a;box-shadow:inset 0 0 0 1px #1a1a1a}
.footer{text-align:center;margin:26px 0 6px}
.footer .logo{width:150px;height:130px;margin:0 auto -6px}
.footer .logo svg{width:100%;height:100%;display:block}
.footer .brand{font-size:17px;font-weight:600;color:#333;letter-spacing:.3px}
.footer .sub{font-size:12.5px;color:#888;margin-bottom:10px}
.ver{cursor:pointer;position:fixed;right:14px;bottom:14px;z-index:7;background:#e6e8eb;color:#8a9097;font:13.5px ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;letter-spacing:.3px;padding:7px 16px;border-radius:99px;box-shadow:0 0 0 3px #eceef0}
.dot{width:10px;height:10px;border-radius:50%;background:#c3c9d1;flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)} .dot.old{background:var(--warn)}
.dot.run{background:#0F766E;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
main{padding:16px 14px 40px;max-width:760px;margin:0 auto}
nav{display:none!important;position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span{font-size:20px;line-height:1}
nav button.active{color:var(--accent);font-weight:600}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--warn);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:16px}
.card{background:var(--card);border:1.5px solid #dcdcdc;border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:130px}
label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:10px 14px;font:inherit;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:#f3c4c4}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;border:1px solid var(--line);overflow:hidden;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);text-align:center;padding:2px;word-break:break-all}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;z-index:2}
.items{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.items td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.items td.num{text-align:right}
.items input{padding:6px;font-size:13.5px}
#stampaBadge{position:fixed;left:12px;right:12px;bottom:16px;z-index:60;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;color:#fff;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#stampaBadge span:nth-child(2){flex:1;line-height:1.35}
#stampaBadge button{background:transparent;border:0;color:#fff;font-size:16px;padding:2px 4px}
#stampaBadge button.pdf{border:1px solid #fff;border-radius:8px;padding:6px 10px;font-size:13.5px;white-space:nowrap}
#stampaBadge.run{background:#2563eb}#stampaBadge.ok{background:#16a34a}#stampaBadge.warn{background:#d97706}#stampaBadge.err{background:#dc2626}
.artline{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.artline span{color:var(--muted);font-size:13px}
.artline .q{width:58px}
.artline .p{width:92px}
.artline .btn.small{padding:6px 10px}
.artnome{display:flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--text);margin:0}
.artnome input{width:18px;height:18px;margin:0}
.entry{display:flex;gap:12px;align-items:center;padding:14px;background:var(--card);border:1.5px solid #dcdcdc;border-radius:16px;margin-bottom:8px}
.entry .ico{width:46px;height:46px;flex:none;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:21px}
.entry .txt{flex:1;min-width:0}
.entry .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .t2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:#eef0f3;color:var(--muted)}
.pill.up{background:var(--accent-soft);color:#115e59}
.pill.nuovo{background:#e5484d;color:#fff}
.pill.adm{background:var(--accent-soft);color:#115e59}.pill.fam{background:var(--ok-soft);color:var(--ok)}
.entry.nuovo{background:#fff8ef}
.perm{display:flex;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line, #e5e7eb);font-size:15px}
.perm input{width:22px;height:22px;margin:0;flex:none}
.codice{font-family:monospace;font-size:12px;word-break:break-all;background:#f4f5f7;border-radius:10px;padding:10px;user-select:all}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1.5px solid #dcdcdc;border-radius:16px;padding:10px;text-align:center;font-size:12.5px}
.stat b{display:block;font-size:22px}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.status{margin-top:10px;font-size:13.5px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1d2530;color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:20}
#toast.show{opacity:1} #toast.err{background:var(--bad)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:14px;right:14px}
.hidden{display:none!important}
.banner{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-soft);border:1px solid #f4d6ab;color:#7a4a05}
.banner.info{background:var(--accent-soft);border:1px solid #bfe6f8;color:#075985}
.banner > div{flex:1}
details{margin-top:8px} summary{color:var(--muted);font-size:13px}
pre.ocr{white-space:pre-wrap;font-size:12px;background:#f6f7f9;border-radius:8px;padding:8px;max-height:260px;overflow:auto}
.side-body{animation:mbob 2.2s ease-in-out infinite}
.side-arm{transform-origin:79px 76px;animation:armSwing 2.2s ease-in-out infinite}
.side-folder{animation:fglow 2.2s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes armSwing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes fglow{0%,30%,100%{filter:none}50%,70%{filter:drop-shadow(0 0 6px #2DD4BF)}}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px 28px}
.modal h2{margin:0 0 4px;font-size:19px;font-weight:500}
.modal .rel{border-top:1px solid var(--line);padding:12px 0}
.modal .rel b{font-size:15px} .modal .rel span{color:#888;font-size:12.5px;margin-left:6px}
.modal .rel ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:#444}

/* guida all'uso */
.g-cap{padding:0;overflow:hidden}
.g-cap summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 16px;font-size:17px;font-weight:600;cursor:pointer}
.g-cap summary::-webkit-details-marker{display:none}
.g-cap summary::after{content:"›";margin-left:auto;color:#aaa;font-size:24px;transition:transform .2s}
.g-cap[open] summary::after{transform:rotate(90deg)}
.g-cap > *:not(summary){margin-left:16px;margin-right:16px}
.g-cap[open]{padding-bottom:14px}
.g-cic{width:40px;height:40px;border-radius:12px;background:#f1f3f5;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.g-cap p,.g-list{font-size:15.5px;line-height:1.55}
.g-list{padding-left:20px}.g-list li{margin-bottom:8px}
.g-passo{display:flex;gap:12px;margin:14px 16px 0}
.g-num{width:30px;height:30px;border-radius:50%;background:#1a1a1a;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.g-tx{flex:1;min-width:0;font-size:15.5px;line-height:1.55}
.g-fig{margin-top:10px}
.g-nota{background:#ecfdf5;border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.5;margin-top:14px}
.g-nota.att{background:#fff4e5}
.g-faq{border-top:1px solid #eee;padding:12px 0;font-size:15px;line-height:1.5}
.g-hl{background:#fde7c8;border-radius:6px;padding:0 5px}
.g-tel{border:6px solid #222;border-radius:22px;overflow:hidden;background:#eef0f2;max-width:330px;font-size:12.5px;pointer-events:none;user-select:none}
.g-bar{background:#161616;color:#fff;padding:9px 10px;display:flex;gap:10px;align-items:center;font-size:14px}
.g-back{background:#333;border-radius:8px;padding:2px 7px;font-size:11px}
.g-st{display:flex;gap:6px;padding:5px 8px;background:#f6f7f8;font-size:10.5px;flex-wrap:wrap}
.g-st span{background:#fff;border:1px solid #ddd;border-radius:99px;padding:2px 8px;display:flex;align-items:center;gap:4px}
.g-dot{width:7px;height:7px;border-radius:50%;background:#3d9a50;display:inline-block}
.g-body{padding:8px;display:grid;gap:7px}
.g-hero{text-align:center;color:#666;padding:6px 0}
.g-tile{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid #dcdcdc;border-radius:14px;padding:9px 10px}
.g-tile small{color:#777}
.g-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.g-cnt{background:#e8a33d;color:#fff;border-radius:99px;font-size:10px;padding:1px 6px}
.g-card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:9px;display:grid;gap:7px}
.g-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g-btn{border:1.5px solid #ddd;border-radius:10px;padding:6px 9px;background:#fff;font-weight:500}
.g-btn.pri{background:#0F766E;border-color:#0F766E;color:#fff}
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g-campo small{color:#777;font-size:10.5px}
.g-inp{border:1.5px solid #ddd;border-radius:9px;padding:6px 8px;background:#fff}
.g-inp.giallo{background:#fff4c2;border-color:#e8a33d}
.g-mut{color:#777}
.g-thumb{width:54px;height:66px;border-radius:8px;background:#f4efe6;display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid #ddd}
.g-ok{color:#166534;font-size:11.5px}
.g-art{border-top:1px solid #eee;padding-top:5px;font-weight:500}
.g-art small{font-weight:400;color:#555}
.g-radio{border:1.5px solid #ddd;border-radius:9px;padding:3px 8px;font-weight:400}
.g-radio.on{color:#1f6fd1}
.g-modal{background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:10px;text-align:center;display:grid;gap:7px}
.g-modal .g-row{justify-content:center}
.g-pill{font-size:10px;border-radius:99px;padding:1px 6px}.g-pill.ok{background:#e7f5ea;color:#2f7a3f}
.g-stats{justify-content:space-between}
.g-stat{flex:1;background:#fff;border-radius:10px;padding:6px;text-align:center;border:1px solid #ddd;font-size:10.5px}
.g-stat b{display:block;font-size:17px}.g-stat.warn b{color:#c77c12}.g-stat.ok b{color:#2f7a3f}.g-stat.bad b{color:#c0392b}
.g-banner{background:#e0f2fe;border:1px solid #bfe6f8;border-radius:10px;padding:8px;color:#075985}
.g-chk{padding:3px 0}
.g-lungo{display:flex;gap:10px;align-items:center}

<script>
"use strict";
/* =========================================================
   Ponte Android
   ========================================================= */
const A = window.AndroidBridge || null;
const pending = {};
window.__bridgeCb = (id, ok, payload) => {
  const p = pending[id]; if(!p) return; delete pending[id];
  ok ? p.res(payload) : p.rej(new Error(payload));
};
// Il collegamento al NAS ogni tanto scade ("DiskShare has already been closed"): l'app lo riapre da sola e riprova
async function call(fn, ...args){
  try{ return await call1(fn, ...args); }
  catch(e){
    if(/^nas/.test(fn) && /already been closed|DiskShare|Connection.*closed|Broken pipe|reset by peer/i.test(String(e && e.message || e))){
      await new Promise(ok => setTimeout(ok, 400));
      try{ return await call1(fn, ...args); }
      catch(e2){ throw new Error("Collegamento al NAS interrotto: riprova tra qualche secondo."); }
    }
    throw e;
  }
}
function call1(fn, ...args){
  if(!A) return Promise.reject(new Error("Funzione disponibile solo nell'app Android."));
  return new Promise((res, rej) => {
    const id = "c" + Date.now() + Math.random().toString(36).slice(2);
    pending[id] = {res, rej};
    try{ A[fn](id, ...args); }catch(e){ delete pending[id]; rej(e); }
  });
}

/* =========================================================
   Elenco locale delle bollette (copia dell'archivio, per cercare anche fuori casa)
   ========================================================= */
let dbp = null;
function db(){
  if(!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open("bollette_di_casa", 1);
    r.onupgradeneeded = () => { const d = r.result; if(!d.objectStoreNames.contains("bollette")) d.createObjectStore("bollette", {keyPath:"id"}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
/* Bozza della bolletta in acquisizione: resta anche se l'app si chiude */
let bozzaDbP = null, bozzaT = null;
function bozzaDb(){
  if(!bozzaDbP) bozzaDbP = new Promise((res, rej) => { const r = indexedDB.open("bollette_bozza", 1); r.onupgradeneeded = () => r.result.createObjectStore("bozza"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return bozzaDbP;
}
async function bozzaOp(mode, fn){ try{ const st = (await bozzaDb()).transaction("bozza", mode).objectStore("bozza"); return await rq(fn(st)); }catch(e){ return null; } }
function salvaBozza(){
  clearTimeout(bozzaT);
  bozzaT = setTimeout(() => {
    if(!draft) return;
    const vuota = !draft.pendingFiles.length && !draft.ente && !draft.importo && !draft._edit;
    if(vuota) bozzaOp("readwrite", st => st.delete("corrente")); else bozzaOp("readwrite", st => st.put(JSON.parse(JSON.stringify(draft)), "corrente"));
  }, 600);
}
function cancellaBozza(){ clearTimeout(bozzaT); bozzaOp("readwrite", st => st.delete("corrente")); }
async function st(mode){ return (await db()).transaction("bollette", mode).objectStore("bollette"); }
async function allBollette(){ return rq((await st("readonly")).getAll()); }
async function getBolletta(id){ return rq((await st("readonly")).get(id)); }
async function putBolletta(a){ return rq((await st("readwrite")).put(a)); }
async function delBolletta(id){ return rq((await st("readwrite")).delete(id)); }

}
const vuoto = v => v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length);

/* ---------- Testo dei PDF (pdf.js, incluso nell'app) ---------- */
let pdfjsP = null;
function pdfjs(){
  if(!pdfjsP) pdfjsP = new Promise((res, rej) => {
    if(window.pdfjsLib) return res(window.pdfjsLib);
    const s = document.createElement("script"); s.src = "pdfjs/pdf.min.js";
    s.onload = () => { try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdfjs/pdf.worker.min.js"; res(window.pdfjsLib); }catch(e){ rej(e); } };
    s.onerror = () => { pdfjsP = null; rej(new Error("Lettore PDF non disponibile.")); };
    document.head.appendChild(s);
  });
  return pdfjsP;
}
const b64bytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function apriPdf(b64){ const lib = await pdfjs(); return lib.getDocument({data:b64bytes(b64), isEvalSupported:false}).promise; }
/* Ricostruisce le righe del PDF in base alla posizione delle scritte */
async function testoPdf(b64, maxPagine = 6){
  const doc = await apriPdf(b64), out = [];
  for(let p = 1; p <= Math.min(doc.numPages, maxPagine); p++){
    const page = await doc.getPage(p), tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({s:it.str, x:it.transform[4], y:it.transform[5], h:Math.abs(it.transform[3]) || it.height || 8, w:it.width || 0}));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const rows = [];
    for(const it of items){
      const row = rows[rows.length - 1];
      if(row && Math.abs(row.y - it.y) <= Math.min(row.h, it.h) * 0.5) row.items.push(it);
      else rows.push({y:it.y, h:it.h, items:[it]});
    }
    for(const row of rows){
      row.items.sort((a, b) => a.x - b.x);
      let line = "", fine = null;
      for(const it of row.items){
        if(fine !== null){ const gap = it.x - fine; line += gap > it.h * 1.5 ? "  " : gap > it.h * 0.15 ? " " : ""; }
        line += it.s; fine = it.x + it.w;
      }
      out.push(line.trim());
    }
    out.push("");
  }
  try{ doc.destroy(); }catch(e){}
  return out.join("\n");
}

    for(const [k, v] of d.righe){ const h = Math.max(block(k, M + 2, y + 3, 9.5, false, 0x666666, 95), block(v, M + 100, y + 3, 9.5, false, 0x111111, COL - 104)); y += h + 6; line(M, y, M + COL, y, 0xDDDDDD, 0.6); }

    y += 12; block(d.piede, M, Math.min(y, H - M - 20), 7.5, false, 0x777777, COL);

  const objs = [];

  const xo = imgs.map((_, i) => `/Im${i} ${7 + i} 0 R`).join(" ");

  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  objs.push(`<< /Length ${cs.length} >>\nstream\n${cs}endstream`);
  imgs.forEach(im => objs.push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bin.length} >>\nstream\n${im.bin}\nendstream`));

function modoStampa(){ const m = settings().stampaCon; return m === "android" || m === "app" ? m : "pdf"; }
/* Prepara le immagini: foto così come sono, PDF → prima pagina */
async function immaginiScheda(a){
  const imgs = [], altri = [];
  const locali = (a.pendingFiles || []);
  const daArchivio = a._edit || !locali.length ? documenti(a) : [];
  const lista = locali.map(f => ({name:f.name, mime:f.mime, data:f.data})).concat(daArchivio.map(f => ({name:f.name, mime:mimeOf(f.name), nas:true})));
  for(const f of lista){
    if(imgs.length >= 2){ altri.push(f.name); continue; }
    try{
      const data = f.nas ? await call("nasRead", a.cartella + "/" + f.name) : f.data;
      if(f.mime === "application/pdf") imgs.push(await primaPaginaJpeg(data));
      else if(f.mime.startsWith("image/")) imgs.push(`data:${f.mime};base64,${data}`);
      else altri.push(f.name);
    }catch(e){ altri.push(f.name); }
  }
  return {imgs, altri};
}
async function stampaScheda(a){
  window.onStampa("prepara");
  const {imgs, altri} = await immaginiScheda(a);
  const d = datiScheda(a, altri), titolo = ("Bolletta " + (a.ente || "") + " " + (a.scadenza || "")).trim().slice(0, 60);
  const nome = titolo.replace(/[^\w\- ]+/g, "_") + ".pdf";
  if(modoStampa() === "android" && A && A.stampaPdf){ await call("stampaPdf", JSON.stringify(Object.assign(d, {immagini:imgs.map(s => s.split(",")[1])})), titolo); return; }
  const b64 = await pdfScheda(d, imgs);
  if(modoStampa() === "app" && A && A.stampaIPrint){ const r = await call("stampaIPrint", b64, titolo); window.onStampa(r === "iprint" ? "iprint" : "scegli"); return; }
  if(A && A.openFile){ A.openFile(nome, "application/pdf", b64); window.onStampa("aperta"); return; }
  // anteprima nel browser
  const w = window.open(URL.createObjectURL(new Blob([b64bytes(b64)], {type:"application/pdf"}))); if(!w) toast("Scheda pronta (anteprima non disponibile qui).");
  window.onStampa("aperta");
}

function decodificaTesto(bytes){
  let t = new TextDecoder("utf-8").decode(bytes);
  if(t.includes("�")){ try{ t = new TextDecoder("windows-1252").decode(bytes); }catch(e){} }
  return t.replace(/^﻿/, "");
}
function parseCSV(t){
  const first = t.split(/\r?\n/)[0] || "";
  const sep = [";", ",", "\t"].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(cell); cell = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && t[i + 1] === "\n") i++; row.push(cell); cell = ""; if(row.some(x => x.trim())) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if(row.some(x => x.trim())) rows.push(row);
  return rows;
}

function catalogoCSV(list){
  const head = ["Casa","Ente","Tipo","N. fattura","Emessa il","Periodo dal","Periodo al","Scadenza","Importo €","Stato","Pagata il","Pagata con","Codice cliente","POD/PDR","Indirizzo fornitura","Consumo","Unità","Lettura","Cartella","File","Note"];
  const pulito = v => String(v ?? "").replace(/[;\r\n]+/g, " ").trim();
  const c = nasCfg(), radice = archivioScelto() === "nas" && c.host ? "\\\\" + c.host + "\\" + c.share + (c.folder ? "\\" + String(c.folder).replace(/[\/\\]+/g, "\\").replace(/^\\|\\$/g, "") : "") : "";
  const percorso = rel => (radice ? radice + "\\" : "") + String(rel || "").replace(/\//g, "\\");
  const stato = {da:"da_pagare", pag:"pagata", dom:"domiciliata"};
  const righe = [...list].filter(a => !a.daCaricare).sort((x, y) => (x.casa || "").localeCompare(y.casa || "", "it") || nomeEnte(x).localeCompare(nomeEnte(y), "it") || (y.scadenza || "").localeCompare(x.scadenza || "")).map(a => {
    const doc = documenti(a)[0];
    const imp = a.importo === "" || a.importo == null || isNaN(Number(a.importo)) ? "" : Number(a.importo).toFixed(2);
    return [a.casa, a.ente, a.tipo, a.numero, a.emessa, a.periodoDa, a.periodoA, a.scadenza, imp, stato[a.stato] || "da_pagare", a.pagataIl, a.pagataCon, a.codiceCliente, a.pod, a.indirizzo,

  });
  return "\ufeff" + [head.join(";"), ...righe].join("\r\n") + "\r\n";
}

const CASE_FILE = "case.json";
async function leggiCase(){
  if(!archivioPronto()) return;
  try{
    const d = JSON.parse(b64dec(await call("nasRead", CASE_FILE)));
    saveSettings({case:Array.isArray(d.case) ? d.case : [], tipiExtra:Array.isArray(d.tipi) ? d.tipi : []});
  }catch(e){

    if((settings().case || []).length && /non trovat|not found|no such|NAME_NOT_FOUND|does not exist|0xc0000034/i.test(e.message || "")) scriviCase().catch(() => {});
  }
}
async function scriviCase(caseL, tipiL){

/* Sposta una bolletta in un'altra cartella (casa nuova): copia i file, scrive bolletta.json, cancella la vecchia */
async function spostaBolletta(b, campi, avanza){
  const nuova = Object.assign({}, b, campi);
  const tutte = await allBollette(); let base = folderFor(nuova), c = base, n = 2;
  while(tutte.some(x => x.id !== b.id && x.cartella.toLowerCase() === c.toLowerCase())) c = `${base} (${n++})`;
  if(c === b.cartella){ Object.assign(b, campi); await call("nasWriteText", b.cartella, INFO_FILE, infoJSON(b)); await putBolletta(b); return b; }
  nuova.cartella = nuova.id = c; nuova.files = [];
  for(const f of (b.files || [])){
    if(f.name === INFO_FILE) continue;
    avanza && avanza(f.name);
    const data = await call("nasRead", b.cartella + "/" + f.name);
    const used = await call("nasWriteFile", c, f.name, data);
    nuova.files.push({name:used, size:f.size});
  }
  await call("nasWriteText", c, INFO_FILE, infoJSON(nuova));
  nuova.hasInfo = true;
  await call("nasDeleteFolder", b.cartella);
  await delBolletta(b.id); await putBolletta(nuova);
  if(A && A.annullaNotifica) A.annullaNotifica(b.id);
  return nuova;
}

/* Riconosce la casa: stesso POD/PDR, codice cliente o indirizzo di bollette già archiviate, oppure indirizzo della casa */
async function indovinaCasa(b){
  const k = x => String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
  const conCasa = (await allBollette()).filter(x => x.casa && caseCasa().some(c => c.nome === x.casa));
  const per = (campo, testo) => { const v = k(b[campo]); if(v.length < 5) return null; const x = conCasa.find(y => k(y[campo]) === v); return x ? {casa:x.casa, perche:testo} : null; };
  const r = per("pod", "dal POD/PDR") || per("codiceCliente", "dal codice cliente") || per("indirizzo", "dall'indirizzo della fornitura");
  if(r) return r;
  const ind = k(b.indirizzo);
  if(ind.length > 6){
    for(const c of caseCasa()){ const via = k(String(c.indirizzo || "").split(",")[0]); if(via.length > 5 && ind.includes(via)) return {casa:c.nome, perche:"dall'indirizzo " + c.indirizzo}; }
  }
  return null;
}
/* Nuova casa: si aggiunge a case.json; se è la prima, le bollette già salvate senza casa ci vengono spostate dentro */
async function creaCasa(c, avanza){
  if(caseCasa().some(x => x.nome.toLowerCase() === c.nome.toLowerCase())) throw new Error("C'è già una casa con questo nome.");
  const lista = caseCasa().concat([Object.assign({id:nuovoId()}, c)]);
  if(archivioPronto()){ await scriviCase(lista); } else saveSettings({case:lista});
  const senza = (await allBollette()).filter(b => !b.casa);
  if(lista.length === 1 && senza.length && archivioPronto()){
    let i = 0;
    for(const b of senza){ i++; avanza && avanza(`Sposto le bollette già salvate in "${c.nome}"… ${i} di ${senza.length}`); if(b.daCaricare){ await delBolletta(b.id); b.casa = c.nome; b.cartella = b.id = folderFor(b); await putBolletta(b); continue; } try{ await spostaBolletta(b, {casa:c.nome}); }catch(e){} }
    syncReminders();
  }
  return lista;
}

/* A Google va solo il primo documento: il PDF così com'è, la foto rimpicciolita (risponde prima e consuma meno) */
async function perGoogle(docs){
  const f = docs.find(d => d.mime === "application/pdf") || docs[0];
  if(!f || !f.mime.startsWith("image/")) return [f];
  try{
    const img = await loadImage(dataUrl(f)), k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return [{name:f.name, mime:"image/jpeg", data:c.toDataURL("image/jpeg", 0.8).split(",")[1]}];
  }catch(e){ return [f]; }
}

async function renderScadenze(){

function syncReminders(){

   GRAFICI
   ========================================================= */
let grafTipo = "", grafAnno = "";
async function renderGrafici(){
  const list = (await allBollette()).filter(b => Number(b.importo) > 0 && dataRif(b) && nellaCasa(b)).map(b => Object.assign({}, b, {tipo:normTipo(b.tipo)}));
  const anni = [...new Set(list.map(b => dataRif(b).slice(0, 4)))].sort().reverse();
  const annoOra = String(new Date().getFullYear());
  if(!grafAnno || !anni.includes(grafAnno)) grafAnno = anni.includes(annoOra) ? annoOra : (anni[0] || annoOra);
  const tipi = [...new Set(list.map(b => b.tipo).filter(Boolean))];
  if(grafTipo && !tipi.includes(grafTipo)) grafTipo = "";
  const sel = list.filter(b => !grafTipo || b.tipo === grafTipo);
  const inAnno = y => sel.filter(b => dataRif(b).startsWith(y));
  const prev = String(+grafAnno - 1), cur = inAnno(grafAnno), old = inAnno(prev);
  const perMese = l => { const m = Array(12).fill(0); l.forEach(b => m[+dataRif(b).slice(5, 7) - 1] += Number(b.importo)); return m; };
  const mc = perMese(cur), mp = perMese(old), max = Math.max(1, ...mc, ...mp);
  const totC = mc.reduce((a, b) => a + b, 0), totP = mp.reduce((a, b) => a + b, 0);
  // per ente
  const perEnte = new Map(); const etE = b => (piuCase() && !filtroCasa && b.casa ? b.casa + " · " : "") + nomeEnte(b); cur.forEach(b => perEnte.set(etE(b), (perEnte.get(etE(b)) || 0) + Number(b.importo)));
  const enti = [...perEnte.entries()].sort((a, b) => b[1] - a[1]), maxE = Math.max(1, ...enti.map(e => e[1]));
  // consumi (solo se un tipo è scelto e c'è l'unità)
  const conCons = grafTipo ? sel.filter(b => Number(b.consumo) > 0 && b.unita).sort((x, y) => dataRif(x).localeCompare(dataRif(y))).slice(-12) : [];
  const maxC = Math.max(1, ...conCons.map(b => Number(b.consumo)));
  const costoMedio = !grafTipo ? null : (() => { const l = cur.filter(b => Number(b.consumo) > 0 && b.unita); const c = l.reduce((t, b) => t + Number(b.consumo), 0); return c ? {v:l.reduce((t, b) => t + Number(b.importo), 0) / c, u:l[0].unita, c} : null; })();
  const diff = totP ? Math.round((totC - totP) / totP * 100) : null;
  $("#view").innerHTML = `
    ${chipsCase()}
    <div class="chips"><button class="chip${!grafTipo ? " on" : ""}" data-t="">Tutte</button>${tipi.map(t => `<button class="chip${grafTipo === t ? " on" : ""}" data-t="${esc(t)}">${tipoInfo(t).ic} ${esc(t)}</button>`).join("")}</div>
    <div class="chips">${(anni.length ? anni : [annoOra]).map(y => `<button class="chip${grafAnno === y ? " on" : ""}" data-y="${y}">${y}</button>`).join("")}</div>
    <div class="kpis">
      <div class="kpi wide"><div class="kv">${esc(euro(totC) || "0 €")}</div><div class="kl">Spesa ${grafAnno}${grafTipo ? " · " + esc(grafTipo) : ""} (${cur.length} bollette)</div></div>
      <div class="kpi"><div class="kv">${totP ? esc(euro(totP)) : "—"}</div><div class="kl">Spesa ${prev}</div></div>
      <div class="kpi"><div class="kv" style="color:${diff === null ? "inherit" : diff > 0 ? "var(--bad)" : "var(--ok)"}">${diff === null ? "—" : (diff > 0 ? "+" : "") + diff + "%"}</div><div class="kl">Rispetto al ${prev}</div></div>
      ${costoMedio ? `<div class="kpi wide"><div class="kv">${costoMedio.v.toLocaleString("it-IT", {minimumFractionDigits:3, maximumFractionDigits:3})} €/${esc(costoMedio.u)}</div><div class="kl">Costo medio ${grafAnno} · consumo ${Math.round(costoMedio.c).toLocaleString("it-IT")} ${esc(costoMedio.u)}</div></div>` : ""}
    </div>
    <div class="card"><h2>Spesa per mese</h2>
      <div class="vb">${mc.map((v, i) => `<div class="vbc"><div class="vbt"><div class="vbf" style="background:#cbd5e1;width:45%;height:${mp[i] / max * 100}%"></div><div class="vbf" style="width:55%;height:${v / max * 100}%"></div></div><div class="vbk">${MESI[i]}</div></div>`).join("")}</div>
      <p class="muted" style="margin:8px 0 0"><span style="color:var(--accent)">■</span> ${grafAnno} &nbsp; <span style="color:#94a3b8">■</span> ${prev} · il mese è quello di fine periodo della bolletta</p></div>
    ${enti.length > 1 || !grafTipo ? `<div class="card"><h2>Spesa per ente</h2>${enti.map(([k, v]) => `<div class="hb"><div class="hbl"><span>${esc(k)}</span><b>${esc(euro(v))}</b></div><div class="hbt"><div class="hbf" style="width:${v / maxE * 100}%"></div></div></div>`).join("") || `<p class="muted">Nessuna bolletta nel ${grafAnno}.</p>`}</div>` : ""}
    ${conCons.length ? `<div class="card"><h2>Consumi ${esc(grafTipo)} (ultime ${conCons.length} bollette)</h2>${conCons.map(b => `<div class="hb"><div class="hbl"><span>${esc(periodoBreve(b) || fmtDate(dataRif(b)))}</span><b>${esc(String(b.consumo).replace(".", ","))} ${esc(b.unita)}</b></div><div class="hbt"><div class="hbf" style="width:${Number(b.consumo) / maxC * 100}%"></div></div></div>`).join("")}</div>` : grafTipo ? "" : `<p class="muted" style="margin:4px">Tocca un tipo (es. 💡 Luce) per vedere anche i consumi.</p>`}
    ${!list.length ? `<div class="card muted">Servono bollette con importo per disegnare i grafici.</div>` : ""}`;

  bindChipsCase(renderGrafici);
  document.querySelectorAll("[data-y]").forEach(b => b.onclick = () => { grafAnno = b.dataset.y; renderGrafici(); });
}

let geminiAttesa = 25000;
async function cercaRate(docs, msg){
  docs = docs || draft.pendingFiles;
  const nomi = nomiCondominio(), tel = rateDaTesto(lastText || draft._testo);
  draft.rate = Object.assign(draft.rate || {}, {stato:"cerco", errore:""});
  if(!settings().geminiKey){ draft.rate = mano(nomi, tel, tel.righe.length ? "" : "Per leggere la tabella serve il controllo online di Google (Impostazioni → Lettura bollette). Intanto puoi scrivere le rate a mano."); salvaBozza(); renderAcquisisci(); return; }
  msg && msg("Cerco nella tabella le righe di " + nomi.map(c => c.nomeCond).join(" e ") + "…");
  try{
    const d = await geminiRate(docs, nomi.map(c => c.nomeCond));
    const uguali = (a, b) => a.length === b.length && a.every((v, i) => Math.abs(v - b[i]) < 0.015);
    const righe = nomi.map(c => {
      const k = x => String(x || "").toLowerCase().replace(/[^a-z]/g, "");
      const g = (d.righe || []).find(x => k(x.cercato) === k(c.nomeCond)) || (d.righe || []).find(x => k(x.nominativo) && (k(x.nominativo).includes(k(c.nomeCond)) || k(c.nomeCond).includes(k(x.nominativo))));
      const rate = (g && Array.isArray(g.rate) ? g.rate : []).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.scadenza || "") && Number(x.importo) > 0)
        .map((x, i) => ({numero:Number(x.numero) || i + 1, scadenza:x.scadenza, importo:Math.round(Number(x.importo) * 100) / 100, stato:"da", pagataIl:"", pagataCon:"", evidenziata:x.evidenziata === true}));
      // precisione: se il telefono ha letto le righe della tabella, gli importi di Google devono essere una di quelle righe
      const dubbio = rate.length > 0 && tel.righe.length > 0 && !tel.righe.some(r => uguali(r, rate.map(x => x.importo)));
      return rate.length ? {casa:c.nome, nominativo:g.nominativo || c.nomeCond, rate, dubbio} : rigaVuota(c, tel);
    });
    draft.rate = {stato:"controllo", condominio:String(d.condominio || tel.condominio || "Condominio").trim(), gestioneDa:d.gestioneDa || tel.gestioneDa || "", gestioneA:d.gestioneA || tel.gestioneA || "", righe, candidati:tel.righe, date:tel.date, errore:""};
  }catch(e){
    draft.rate = mano(nomi, tel, "La lettura online non è riuscita (" + e.message + ")." + (tel.righe.length ? " Il telefono ha letto la tabella: tocca la tua riga qui sotto." : " Puoi riprovare oppure scrivere le rate a mano."));
  }
  salvaBozza(); renderAcquisisci();
}
function rigaVuota(c, tel){ return {casa:c.nome, nominativo:"", scegli:tel.righe.length > 0, rate:[1, 2, 3, 4].map((n, i) => ({numero:n, scadenza:tel.date[i] || "", importo:"", stato:"da"}))}; }
function mano(nomi, tel, errore){
  return {stato:"controllo", condominio:tel.condominio || "Condominio", gestioneDa:tel.gestioneDa || "", gestioneA:tel.gestioneA || "", righe:nomi.map(c => rigaVuota(c, tel)), candidati:tel.righe, date:tel.date, errore};
}
/* Lettura del prospetto solo con il telefono: nome del condominio, gestione, date delle rate e le righe della tabella (4 importi). */
function rateDaTesto(t){
  t = String(t || "");
  const out = {condominio:"", gestioneDa:"", gestioneA:"", date:[], righe:[]};
  const iso = d => { const m = d.match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; };
  const c = t.match(/Condominio(?:[ \t]+(?:[A-ZÀ-Ü][\wÀ-ü'’.]*|di|del|della|dei|degli|delle|gli|le|la|il|lo|i))+/);
  if(c) out.condominio = c[0].replace(/\s+(?:di|del|della|dei|degli|delle|gli|le|la|il|lo|i)$/i, "").trim();
  const g = t.match(/dal\s+(\d{2}\/\d{2}\/\d{4})\s+al\s+(\d{2}\/\d{2}\/\d{4})/i);
  if(g){ out.gestioneDa = iso(g[1]); out.gestioneA = iso(g[2]); }
  const tutte = [...new Set((t.match(/\b\d{2}\/\d{2}\/20\d{2}\b/g) || []).map(iso))].filter(d => d && d !== out.gestioneDa && d !== out.gestioneA && (!out.gestioneDa || (d >= out.gestioneDa && d <= out.gestioneA))).sort();
  out.date = tutte.slice(0, 6);
  const num = s => Number(s.replace(/[\s.](?=\d{3}(?:\D|$))/g, "").replace(",", "."));
  const viste = new Set();
  t.split(/\n/).forEach(riga => {
    const v = (riga.match(/-?\d{1,3}(?:[.\s]\d{3})*,\d{2}(?!\d)|-?\d+\.\d{2}(?!\d)/g) || []).map(num).filter(x => !isNaN(x));
    if(v.length < 4) return;
    const r = v.slice(-4), [a, b, cc, d] = r;
    // le ultime 3 rate sono quasi uguali (stessa percentuale), la prima è diversa ma positiva
    if(!(a > 0 && b > 0 && Math.abs(b - cc) <= 0.03 && Math.abs(b - d) <= 0.05)) return;
    if(v.length >= 5 && Math.abs(v[v.length - 5] - (a + b + cc + d)) > 0.05 && v[v.length - 5] > a) { /* il residuo non torna: tengo comunque la riga, è solo un controllo in più */ }
    const k = r.map(x => x.toFixed(2)).join("|"); if(viste.has(k)) return; viste.add(k);
    out.righe.push(r);
  });
  return out;
}
async function piccola(f, lato){
  if(!f.mime.startsWith("image/")) return f;
  try{
    const img = await loadImage(dataUrl(f)), k = Math.min(1, lato / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return {name:f.name, mime:"image/jpeg", data:c.toDataURL("image/jpeg", 0.85).split(",")[1]};
  }catch(e){ return f; }
}
async function geminiRate(files, nomi){
  const parts = [];
  for(const f of files.slice(0, 3)){ const p = await piccola(f, 2000); parts.push({inline_data:{mime_type:p.mime, data:p.data}}); }
  parts.push({text:`Queste foto (${parts.length}) mostrano un prospetto delle rate di un condominio italiano: una tabella con una riga per condòmino; alcune foto possono essere ingrandimenti di una parte della stessa tabella. Considera SOLO le colonne delle rate (1ª rata, 2ª rata, 3ª rata, 4ª rata…), ognuna con la sua data di scadenza scritta nell'intestazione della colonna. Ignora Totale preventivo, Saldo gestione precedente, Totale generale, Versamenti, Residuo e le scritte a mano.
Per ciascuno di questi nominativi trova la sua riga (il nome può essere scritto in modo leggermente diverso): ${nomi.map(n => '"' + n + '"').join(", ")}.
Rispondi SOLO con JSON: {"condominio":"nome del condominio (es. Condominio Residence Gli Oleandri)","gestioneDa":"AAAA-MM-GG","gestioneA":"AAAA-MM-GG","righe":[{"cercato":"il nome che ti ho dato","nominativo":"come è scritto nella tabella","rate":[{"numero":1,"scadenza":"AAAA-MM-GG","importo":numero,"evidenziata":true|false}]}]}. "evidenziata" è true se la cella dell'importo è colorata con l'evidenziatore. Leggi gli importi con attenzione, cifra per cifra, sulla riga giusta. Se un nominativo non c'è, restituiscilo con "rate":[].`});
  geminiAttesa = 60000;
  let res; try{ res = await geminiSicuro({contents:[{role:"user", parts}], generationConfig:{temperature:0, responseMimeType:"application/json"}}); } finally{ geminiAttesa = 25000; }
  const {status, j} = res;
  if(status === 429) throw new Error("limite gratuito di Google raggiunto");
  if(status !== 200) throw new Error("Google: " + (j.error?.message || status));
  const txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
  const m = txt.match(/\{[\s\S]*\}/); if(!m) throw new Error("risposta non leggibile");
  return JSON.parse(m[0]);
}

function leggiRate(){

  document.querySelectorAll("[data-ri]").forEach(el => { const [i, j] = el.dataset.ri.split("-").map(Number); const v = el.value.trim().replace(/[€\s]/g, ""); R.righe[i].rate[j].importo = v === "" ? "" : Number(v.replace(/\.(?=\d{3}(,|$))/g, "").replace(",", ".")); });
}

async function salvaRate(){
  leggiRate();
  const R = draft.rate, o = $("#rOut"), tutte = [];
  R.righe.filter(h => !(h.scegli && !h.nominativo)).forEach(h => h.rate.forEach(x => tutte.push({h, x})));
  if(!tutte.length){ esito(o, false, "Non ci sono rate da salvare."); return; }
  if(tutte.some(({x}) => !x.scadenza || !(Number(x.importo) > 0))){ esito(o, false, "Ogni rata deve avere scadenza e importo (oppure toglila)."); return; }
  if(!R.condominio){ esito(o, false, "Scrivi il nome del condominio."); return; }
  const b = $("#rSalva"); b.disabled = true;
  const me = io(), ora = new Date().toISOString(), totali = {};
  tutte.forEach(({h}) => totali[h.casa] = (totali[h.casa] || 0) + 1);
  let fatte = 0, saltate = 0, sulTel = 0;
  for(const {h, x} of tutte){
    esito(o, null, `Salvo la rata ${fatte + saltate + 1} di ${tutte.length}…`);
    const n = Object.assign(newDraft(), {casa:h.casa, ente:R.condominio, tipo:"Condominio", importo:Number(x.importo), scadenza:x.scadenza,
      numero:`${x.numero}ª rata${h.rate.length ? " di " + h.rate.length : ""}`, periodoDa:R.gestioneDa || "", periodoA:R.gestioneA || "",
      stato:x.stato === "pag" ? "pag" : "da", pagataIl:x.pagataIl || "", pagataCon:x.pagataCon || "", note:`${x.numero}ª rata${h.nominativo ? " · " + h.nominativo : ""}`, datiAuto:true});
    if(await doppione(n)){ saltate++; continue; }
    if(me){ n.aggiuntoDa = me.nome; n.aggiuntoDaId = me.id; n.aggiuntoIl = ora; }
    const all = await allBollette(); let base = folderFor(n), c = base, k = 2;
    while(all.some(y => y.cartella.toLowerCase() === c.toLowerCase())) c = `${base} (${k++})`;
    n.cartella = n.id = c;
    n.pendingFiles = draft.pendingFiles.map((f, i) => ({name:(f.mime === "application/pdf" ? "prospetto_rate" + (i ? "_" + (i + 1) : "") + ".pdf" : `prospetto_rate_${i + 1}.${extOf(f.name) || "jpg"}`), mime:f.mime, data:f.data}));
    n.daCaricare = true;
    try{ if(!archivioPronto()) throw new Error("archivio non raggiungibile"); await writeToNas(n); }catch(e){ sulTel++; }
    await putBolletta(n); fatte++;
  }
  syncReminders();
  draft = null; lastText = ""; cancellaBozza();
  toast(`✅ ${fatte} rate salvate` + (saltate ? `, ${saltate} erano già nell'archivio` : "") + (sulTel ? ` (${sulTel} sul telefono, da caricare)` : "") + ".");
  navStack = []; setView("scadenze");
}

async function renderImpCasa(nome){
  const c = caseCasa().find(x => x.nome === nome) || {nome:"", indirizzo:"", icona:"🏠"}, nuova = !c.nome;
  const n = c.nome ? (await allBollette()).filter(b => b.casa === c.nome).length : 0;
  let icona = c.icona || "🏠";
  $("#hTitle").textContent = nuova ? "Nuova casa" : c.nome;
  $("#view").innerHTML = `<div class="card"><h2>${nuova ? "➕ Nuova casa" : esc(icona) + " " + esc(c.nome)}</h2>
    <label>Nome (è anche il nome della cartella)</label><input id="hcNome" value="${esc(c.nome)}" placeholder="es. Casa mamma" autocomplete="off"${n ? " disabled" : ""}>
    ${n ? `<p class="muted">Il nome non si può cambiare perché la casa ha già ${n} bollette nella sua cartella.</p>` : ""}

    <div class="btns"><button class="btn primary" id="hcSalva">💾 Salva</button></div>
    ${!nuova && !n ? `<div class="btns"><button class="btn danger" id="hcDel">🗑️ Togli questa casa</button></div>` : ""}
    <div id="hcOut"></div></div>`;
  document.querySelectorAll("#hcIc button").forEach(b => b.onclick = () => { icona = b.dataset.i; document.querySelectorAll("#hcIc button").forEach(x => x.classList.toggle("on", x === b)); });
  $("#hcSalva").onclick = async () => {
    const o = $("#hcOut"), nomeN = safeName($("#hcNome").value), ind = $("#hcInd").value.trim();
    if(!nomeN){ esito(o, false, "Scrivi il nome della casa."); return; }
    if(!archivioPronto()){ esito(o, false, "Serve l'archivio raggiungibile per salvare la casa."); return; }
    esito(o, null, "Salvo…");
    try{
      const nomeCond = ($("#hcCond").value || "").trim().toUpperCase();
      if(nuova) await creaCasa({nome:nomeN, indirizzo:ind, icona, nomeCond}, m => esito(o, null, m));
      else{
        if(nomeN !== c.nome && caseCasa().some(x => x.nome.toLowerCase() === nomeN.toLowerCase())) throw new Error("C'è già una casa con questo nome.");
        await scriviCase(caseCasa().map(x => x.nome === c.nome ? Object.assign({}, x, {nome:nomeN, indirizzo:ind, icona, nomeCond}) : x));
      }
      toast("Casa salvata."); setView("impCase", undefined, true);
    }catch(e){ esito(o, false, e.message); }
  };
  if($("#hcDel")) $("#hcDel").onclick = async () => {
    if(!(await conferma(`Togliere la casa "${c.nome}"?`, "Togli", true))) return;
    try{ await scriviCase(caseCasa().filter(x => x.nome !== c.nome)); toast("Casa tolta."); setView("impCase", undefined, true); }catch(e){ esito($("#hcOut"), false, e.message); }
  };
}

/* ---------- Lettura bollette ---------- */
function renderImpLett(){
  const s = settings(), adm = !io() || (utenteAttivo() || {}).ruolo === "admin";
  $("#view").innerHTML = `
    <div class="card">
      <h2>🔎 Lettura automatica</h2>
      <p class="muted">Dai <b>PDF</b> arrivati per email l'app legge il testo direttamente: è la lettura più precisa. Le <b>foto</b> e i PDF scansionati vengono letti con l'OCR di Google sul telefono. Tutto gratis e senza internet.</p>
    </div>
    ${!adm ? `<div class="card"><h2>🌐 Lettura online gratuita</h2><p class="muted">${s.geminiKey ? "Attiva: la chiave l'ha condivisa l'amministratore di casa." : "Non attiva: l'amministratore di casa non ha ancora inserito la chiave di Google."}</p></div>` : `<div class="card">
      <h2>🌐 Controllo online gratuito (Google)</h2>
      <p class="muted">Con la chiave gratuita di Google ogni bolletta viene letta <b>anche online</b> e i dati vengono incrociati: se importo o scadenza non coincidono, il campo diventa <b>giallo</b> e lo controlli tu. Meglio una chiave <b>solo per Bollette</b>, creata in un <b>progetto nuovo</b> (Create API key → Create API key in new project): così il limite gratuito di Google non viene consumato da Garanzie & Scontrini.</p>
      <p class="muted"><b>Come avere la chiave (una volta sola):</b><br>1. Tocca il link qui sotto ed entra con il tuo account Google.<br>2. Tocca <b>Create API key</b> → <b>Create API key in new project</b>, e copia la chiave.<br>3. Incollala qui sotto e tocca Salva.</p>
      <p><a href="https://aistudio.google.com/apikey">👉 Apri aistudio.google.com/apikey</a></p>
      <label>Chiave Google (gratuita)</label><input id="gKey" type="password" value="${esc(s.geminiKey || "")}" placeholder="AIza…" autocomplete="off" autocapitalize="off">
      <label style="display:flex;gap:10px;align-items:center;color:var(--text);font-size:14.5px;margin-top:6px"><input type="checkbox" id="gShow" style="width:auto;margin:0"> Mostra la chiave</label>
      <div class="btns"><button class="btn" id="gTest">▶️ Verifica</button><button class="btn primary" id="gSave">💾 Salva</button></div>
      <div id="gOut"></div>
      <label style="display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:14.5px;margin-top:12px"><input type="checkbox" id="gIncr" style="width:auto;margin-top:3px"${s.incrocio !== false ? " checked" : ""}> Usa il controllo online quando leggo una bolletta (consigliato).</label>
    </div>`}
    <div class="card">
      <h2>🧪 Prova sull'archivio</h2>
      <p class="muted">Rilegge le bollette già salvate e controlla se ente, importo e scadenza vengono riconosciuti. Alla fine crea il file <b>prova_lettura</b> nella cartella Download: mandalo nella chat per migliorare la lettura.</p>
      <div class="btns"><button class="btn primary" id="tProva">🧪 Avvia la prova</button></div>
      <div id="tOut"></div>
    </div>`;
  $("#tProva").onclick = async () => {
    const o = $("#tOut"), b = $("#tProva");
    if(!archivioPronto()){ esito(o, false, "Prima collega l'archivio."); return; }
    const tutti = (await allBollette()).filter(a => !a.daCaricare && documenti(a).length && a.hasInfo);
    if(!tutti.length){ esito(o, false, "Nell'archivio non ci sono ancora bollette controllate da provare."); return; }
    b.disabled = true; const ris = []; let ok = {ente:0, importo:0, scadenza:0};
    for(let i = 0; i < tutti.length && i < 150; i++){
      const a = tutti[i], f = documenti(a)[0];
      esito(o, null, `Leggo ${i + 1} di ${Math.min(150, tutti.length)}: ${a.ente}… (tieni l'app aperta)`);
      const r = {cartella:a.cartella, file:f.name, attesi:{ente:a.ente, importo:a.importo, scadenza:a.scadenza}};
      try{
        r.testo = await testoDocumenti([{name:f.name, mime:mimeOf(f.name), data:await call("nasRead", a.cartella + "/" + f.name)}]);
        const p = parseBolletta(r.testo); r.letti = p;
        if(p.ente && p.ente.toLowerCase() === String(a.ente).toLowerCase()) ok.ente++;
        if(Math.abs((Number(p.importo) || 0) - (Number(a.importo) || 0)) < 0.01) ok.importo++;
        if(p.scadenza && p.scadenza === a.scadenza) ok.scadenza++;
      }catch(e){ r.errore = e.message; }
      ris.push(r);
    }
    let dove = ""; try{ dove = await salvaFile(`prova_lettura_${todayISO()}.json`, "application/json", JSON.stringify({app:"BolletteDiCasa", versione:VERSIONE, risultati:ris}, null, 1)); }catch(e){ dove = "(non salvato: " + e.message + ")"; }
    const n = ris.length;
    o.innerHTML = `<div class="okline">✅ Prova finita su ${n} bollette</div><div class="kvr"><span>Ente giusto</span><b>${ok.ente}/${n}</b></div><div class="kvr"><span>Importo giusto</span><b>${ok.importo}/${n}</b></div><div class="kvr"><span>Scadenza giusta</span><b>${ok.scadenza}/${n}</b></div><p class="muted">File con i dettagli: ${esc(dove)}</p>`;
    b.disabled = false;
  };
  if(!$("#gSave")) return;
  const gSave = () => {
    const k = $("#gKey").value.trim(), cambiata = k !== (settings().geminiKey || "");
    saveSettings({geminiKey:k});
    if(cambiata && io() && (utenteAttivo() || {}).ruolo === "admin" && archivioScelto() === "nas") leggiUtenti().then(l => l.length && scriviUtenti(l)).catch(() => {});
  };
  $("#gSave").onclick = () => { gSave(); esito($("#gOut"), true, io() ? "Salvata. Vale anche per gli utenti di casa." : "Salvata."); };
  $("#gShow").onchange = e => { $("#gKey").type = e.target.checked ? "text" : "password"; };
  $("#gIncr").onchange = e => { saveSettings({incrocio:e.target.checked}); toast(e.target.checked ? "Controllo online attivo" : "Solo lettura sul telefono"); };
  $("#gTest").onclick = async () => {
    gSave(); const o = $("#gOut");
    if(!settings().geminiKey){ esito(o, false, "Incolla prima la chiave."); return; }
    esito(o, null, "Provo il collegamento a Google…");
    try{
      const t0 = Date.now();
      const {status, j} = await geminiSicuro({contents:[{parts:[{text:"Rispondi solo OK"}]}]}, t => esito(o, null, t + " (" + Math.round((Date.now() - t0) / 1000) + " s)"));
      if(status === 200) esito(o, true, "Funziona! Le bollette verranno controllate anche online.");
      else if(status === 429){
        const msg = String(j.error?.message || ""), giorno = /per\s*day|daily|PerDay/i.test(msg);
        esito(o, false, giorno ? "La chiave è giusta, ma ha finito il limite gratuito di OGGI (è la stessa chiave di Garanzie?). Riprova domani, oppure crea una seconda chiave in un PROGETTO NUOVO solo per Bollette." : "La chiave è giusta, ma ha superato il limite del minuto: riprova tra un minuto.");
        if(msg) o.insertAdjacentHTML("beforeend", `<p class="muted" style="margin-top:6px">Risposta di Google: ${esc(msg.slice(0, 220))}</p>`);
      }
      else if(status === 408) esito(o, false, "Google non risponde (" + (j.error?.message || "") + "). Se la chiave è nuova, aspetta 2-3 minuti e riprova: Google ci mette un po' ad attivarla.");
      else if(status === 503 || status === 500) esito(o, true, "La chiave è giusta ✔ ma i server di Google adesso sono sovraccarichi (errore " + status + "): riprova tra qualche minuto.");
      else if(status === 400 || status === 403) esito(o, false, "Chiave non valida: ricopiala da aistudio.google.com/apikey.");
      else esito(o, false, "Errore " + status + ": " + (j.error?.message || ""));
    }catch(e){ esito(o, false, "Nessuna risposta: controlla internet. (" + e.message + ")"); }
  };
}

const UTENTI_FILE = "utenti.json";
const PERMESSI = [["aggiungere","Aggiungere bollette"],["modificaPropri","Modificare le sue bollette"],["modificaAltri","Modificare le bollette degli altri"],["eliminare","Eliminare bollette"],["gestire","Gestire utenti e impostazioni (NAS, backup)"]];
const io = () => settings().utente || null;                       // chi usa questo telefono {id, nome}
const utentiCasa = () => settings().utenti || [];
const utenteAttivo = () => { const me = io(); return me ? utentiCasa().find(u => u.id === me.id) || null : null; };
const piuUtenti = () => !!io() && utentiCasa().length > 1;
function puo(k){
  const me = io(); if(!me) return true;                           // utenti non attivati: si può fare tutto, come prima
  const u = utenteAttivo(); if(!u) return false;                  // utente rimosso
  return u.ruolo === "admin" || !!(u.permessi || {})[k];
}
function mio(a){ const me = io(); if(!me) return true; return a.aggiuntoDaId ? a.aggiuntoDaId === me.id : (utenteAttivo() || {}).ruolo === "admin"; }
const puoModificare = a => puo(mio(a) ? "modificaPropri" : "modificaAltri");
function nuovoPerMe(a){
  const me = io(), st = settings(); if(!me || !a.aggiuntoDaId || a.aggiuntoDaId === me.id) return false;
  return (a.aggiuntoIl || "") > (st.utenteDal || "") && !(st.visti || []).includes(a.id);
}
function segnaVisto(id){ const v = settings().visti || []; if(!v.includes(id)){ v.push(id); saveSettings({visti:v.slice(-800)}); } }
const nuovoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const b64dec = b => new TextDecoder("utf-8").decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));
async function leggiUtentiDoc(){
  try{ return JSON.parse(b64dec(await call("nasRead", UTENTI_FILE))); }
  catch(e){ if(/non trovat|not found|no such|STATUS_OBJECT_NAME_NOT_FOUND|does not exist|0xc0000034/i.test(e.message || "")) return {}; throw e; }
}
async function leggiUtenti(){
  try{ const d = JSON.parse(b64dec(await call("nasRead", UTENTI_FILE))); return Array.isArray(d.utenti) ? d.utenti : []; }
  catch(e){ if(/non trovat|not found|no such|STATUS_OBJECT_NAME_NOT_FOUND|does not exist|0xc0000034/i.test(e.message || "")) return []; throw e; }
}
async function scriviUtenti(list){
  let chiave = (utenteAttivo() || {}).ruolo === "admin" ? (settings().geminiKey || "") : "";
  if(!chiave){ try{ chiave = (await leggiUtentiDoc()).chiaveGoogle || ""; }catch(e){} }
  await call("nasWriteText", "", UTENTI_FILE, JSON.stringify({app:"BolletteDiCasa", tipo:"utenti", aggiornato:new Date().toISOString(), chiaveGoogle:chiave, utenti:list}, null, 2));
  saveSettings({utenti:list});
}
async function aggiornaUtenti(){
  if(!io() || archivioScelto() !== "nas") return;
  try{
    const d = await leggiUtentiDoc(), l = Array.isArray(d.utenti) ? d.utenti : [];
    if(l.length) saveSettings({utenti:l});
    // la chiave gratuita di Google dell'amministratore vale per tutta la famiglia
    if(d.chiaveGoogle && (utenteAttivo() || {}).ruolo !== "admin" && d.chiaveGoogle !== settings().geminiKey) saveSettings({geminiKey:d.chiaveGoogle});
    // telefono dell'amministratore: se nel file manca la chiave (o è vecchia) la scrive, così arriva anche a chi è già stato invitato
    else if((utenteAttivo() || {}).ruolo === "admin" && settings().geminiKey && d.chiaveGoogle !== settings().geminiKey && l.length) await scriviUtenti(l);
  }catch(e){}
}
const descrPermessi = u => u.ruolo === "admin" ? "Può fare tutto · gestisce gli utenti" : PERMESSI.filter(([k]) => (u.permessi || {})[k]).map(([, t]) => t.replace(/ \(.*\)/, "")).join(" · ") || "Può solo vedere";
function codiceInvito(u){
  const nas = nasCfg(); delete nas.hasPassword;
  if(A && A.getNasPassword) nas.password = A.getNasPassword();
  return "BC1-" + b64utf8(JSON.stringify({v:1, utente:u, nas, chiaveGoogle:settings().geminiKey || ""})).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function leggiCodice(t){
  const m = String(t || "").match(/BC1-([A-Za-z0-9_-]{20,})/); if(!m) throw new Error("Codice non valido: copia tutto il messaggio dell'invito e incollalo qui.");
  let b = m[1].replace(/-/g, "+").replace(/_/g, "/"); while(b.length % 4) b += "=";
  const d = JSON.parse(b64dec(b)); if(!d.utente || !d.nas || !d.nas.host) throw new Error("Codice non valido.");
  return d;
}

    </div>`;
  $("#bExp").onclick = async () => {
    const o = $("#bExpOut"), s = settings(), pass = $("#bPass").checked;
    const nas = nasCfg(); delete nas.hasPassword;
    if(pass && A && A.getNasPassword) nas.password = A.getNasPassword();
    const imp = {giorniPrima:s.giorniPrima, giornoStesso:s.giornoStesso, scaduteOgniGiorno:s.scaduteOgniGiorno, domiciliate:s.domiciliate, archivio:archivioScelto(), stampaCon:s.stampaCon || "", incrocio:s.incrocio};
    if(pass) imp.geminiKey = s.geminiKey || "";
    const dati = {app:"BolletteDiCasa", tipo:"impostazioni", versioneApp:VERSIONE, creato:new Date().toISOString(), conPassword:pass, impostazioni:imp, nas};
    try{ const dove = await salvaFile(`BolletteDiCasa_impostazioni_${todayISO()}.json`, "application/json", JSON.stringify(dati, null, 2)); esito(o, true, "Salvato in " + dove); }
    catch(e){ esito(o, false, e.message); }
  };
  $("#bImp").onclick = () => $("#bImpFile").click();
  $("#bImpFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if(!f) return;
    const o = $("#bImpOut");
    try{
      const d = JSON.parse(await f.text());
      if(d.app !== "BolletteDiCasa" || d.tipo !== "impostazioni") throw new Error("Il file non è un backup delle impostazioni di Bollette di casa.");
      if(!(await conferma(`Importare le impostazioni del ${fmtDate((d.creato || "").slice(0, 10))}?\n\nQuelle attuali vengono sostituite.`, "Importa"))) return;
      const imp = d.impostazioni || {};
      if(imp.geminiKey === undefined) imp.geminiKey = settings().geminiKey;
      saveSettings(imp);
      if(d.nas && A) A.setNasConfig(JSON.stringify(d.nas));
      if(A && A.setArchivio) A.setArchivio(archivioScelto());
      syncReminders(); setNasState("unknown");
      esito(o, true, "Impostazioni importate" + (d.conPassword ? "." : ". Le password non erano nel file: inseriscile in Dove salvare."));
      if(archivioPronto()) refreshFromNas(true);
    }catch(err){ esito(o, false, err.message); }
  };
  $("#bCsv").onclick = async () => {
    const o = $("#bCsvOut"), list = await allBollette();
    try{ const dove = await salvaFile(CATALOGO, "text/csv", catalogoCSV(list)); esito(o, true, `${list.length} bollette esportate in ${dove}`); }
    catch(e){ esito(o, false, e.message); }
  };
  $("#bCsvNas").onclick = async () => {
    const o = $("#bCsvOut");
    if(!archivioPronto()){ esito(o, false, "Archivio non raggiungibile: usa \"Salva in Download\"."); return; }
    try{ const list = await allBollette(); await call("nasWriteText", "", CATALOGO, catalogoCSV(list)); esito(o, true, `Catalogo salvato nell'archivio con ${list.filter(a => !a.daCaricare).length} bollette.`); }
    catch(e){ esito(o, false, e.message); }
  };
}
function renderImpInfo(){
  const ultimo = CRONOLOGIA[0];
  $("#view").innerHTML = `
    <div class="card">
      <h2>ℹ️ Bollette di casa</h2>
      <table class="items">
        <tr><td>Versione</td><td class="num">${VERSIONE}</td></tr>
        <tr><td>App Android</td><td class="num">${A ? "build " + versioneApk() : "—"}</td></tr>
        <tr><td>Ultimo aggiornamento</td><td class="num">${ultimo.d}</td></tr>
        <tr><td>Sviluppo</td><td class="num">TR/software</td></tr>
      </table>
      <div class="btns"><button class="btn" id="iCron">📜 Cronologia aggiornamenti</button><button class="btn primary" id="iCheck">🔄 Cerca aggiornamenti</button></div>
      <div id="iOut"></div>
    </div>`;
  $("#iCron").onclick = showCronologia;
  $("#iCheck").onclick = () => {
    if(A && A.getPendingUpdate && A.getPendingUpdate()){ updRinviato = false; proponiAggiornamento(); return; }
    if(proponiApk(true)) return;
    if(A && A.checkUpdateNow){ A.checkUpdateNow(); esito($("#iOut"), null, "Controllo su GitHub…"); setTimeout(() => { if(!document.querySelector(".modal")) esito($("#iOut"), true, "Hai già l'ultima versione."); }, 6000); }
    else esito($("#iOut"), true, "Anteprima: nell'app qui controlla se c'è una versione nuova.");
  };
}

/* =========================================================
   Avvio
   ========================================================= */
window.onAndroidBack = () => {
  const ov = document.querySelector(".viewer, .modal"); if(ov){ ov.remove(); return true; }
  if(current === "home") return false;              // dalla pagina iniziale si esce dall'app
  if(current === "acquisisci" && draft && draft.casa && piuCase() && bozzaVuota()){ draft.casa = ""; renderAcquisisci(); return true; }
  let prev = navStack.pop();
  while(prev && prev.v === "dettaglio" && !prev.arg) prev = navStack.pop();
  if(prev) setView(prev.v, prev.arg, true); else setView("home", undefined, true);
  return true;
};
/* ---------- aggiornamenti: avviso con scelta ---------- */
let updRinviato = false, updInAttesa = false;
function leggiNovita(html){
  const out = {v:"", note:[]};
  const mv = html.match(/const VERSIONE = "([^"]+)"/); if(mv) out.v = mv[1];
  const mc = html.match(/const CRONOLOGIA = (\[[\s\S]*?\n\]);/);
  if(mc){ try{ const cr = new Function("return " + mc[1])(); const r = cr.find(x => x.v === out.v) || cr[0]; if(r) out.note = r.n || []; }catch(e){} }
  return out;
}
function occupato(){ return (current === "acquisisci" && draft && ((draft.pendingFiles || []).length || draft.ente || draft.importo)) || document.querySelector(".modal"); }
function proponiAggiornamento(){
  if(!A || !A.getPendingUpdate || updRinviato) return;
  if(typeof versioneApk === "function" && versioneApk() < APK_MINIMO){ proponiApk(false); return; }   // un solo aggiornamento: l'app nuova contiene già tutto
  const html = A.getPendingUpdate(); if(!html) return;
  if(occupato()){ updInAttesa = true; return; }      // lo propone appena torni alla pagina iniziale
  updInAttesa = false;
  const n = leggiNovita(html), stessa = n.v === VERSIONE;
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h2>🔄 ${stessa ? "Aggiornamento disponibile" : "È disponibile la " + esc(n.v)}</h2>
    <p class="muted" style="margin:0 0 8px">Versione installata: ${VERSIONE}${n.v && !stessa ? " → nuova: " + esc(n.v) : ""}</p>
    ${n.note.length ? `<div class="rel"><b>Novità</b><ul>${n.note.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    <div class="btns"><button class="btn" id="updDopo">Più tardi</button><button class="btn primary" id="updOra">Aggiorna ora</button></div></div>`;
  document.body.appendChild(m);
  $("#updDopo").onclick = () => { updRinviato = true; m.remove(); toast("Te lo ricordo alla prossima apertura."); };
  $("#updOra").onclick = () => { try{ sessionStorage.setItem("bc_aggiornata", "1"); }catch(e){} m.remove(); A.applyUpdate(); };
}
window.onWebUpdate = proponiAggiornamento;
try{ if(sessionStorage.getItem("bc_aggiornata")){ sessionStorage.removeItem("bc_aggiornata"); setTimeout(() => toast("✅ App aggiornata alla " + VERSIONE), 600); } }catch(e){}
setTimeout(proponiAggiornamento, 1500);   // versione scaricata in precedenza e non ancora applicata

/* Aggiornamento dell'app Android (APK): la grafica si aggiorna da sola, ma alcune novità
   (es. la stampa) richiedono di reinstallare l'app sopra quella attuale. */
const APK_MINIMO = 1, APK_LINK = "https://github.com/vitobsta-cloud/Bollette-di-casa-app/releases/latest/download/BolletteDiCasa.apk";
function versioneApk(){ if(!A) return 999; try{ if(A.getVersionCode) return Number(A.getVersionCode()) || 0; }catch(e){} return A.aggiornaInSilenzio ? 13 : A.stampaPdf ? 12 : A.installApk ? 10 : A.stampa ? 9 : 8; }
let aggSilenzioAvviato = false;
function proponiApk(forza){
  if(versioneApk() >= APK_MINIMO) return false;
  // app che sa aggiornarsi da sola: niente domande. Scarica in sottofondo e installa quando esci dall'app
  if(A && A.aggiornaInSilenzio){
    let err = ""; try{ err = A.erroreAggiornamento() || ""; }catch(e){}
    if(forza && A.aggiornaOra){
      toast("Aggiorno l'app… si chiuderà e sarà subito pronta.");
      call("aggiornaOra").then(r => { if(r === "permesso") toast("Consenti \"Installa app\" per Bollette di casa, poi torna e riprova.", true); }).catch(e => toast(e.message, true));
      return true;
    }
    if(!err){
      if(!aggSilenzioAvviato){ aggSilenzioAvviato = true; call("aggiornaInSilenzio").then(r => { if(r === "permesso"){ aggSilenzioAvviato = false; proponiApkDialogo(); } }).catch(() => { aggSilenzioAvviato = false; }); }
      return true;
    }
    // se l'installazione automatica non è riuscita si torna al messaggio con il tasto
  }
  return proponiApkDialogo(forza);
}
function proponiApkDialogo(forza){
  if(versioneApk() >= APK_MINIMO) return false;
  if(!forza){ try{ if(localStorage.getItem("bc_apk_rinvio") === todayISO()) return true; const t = +localStorage.getItem("bc_apk_tentato") || 0; if(Date.now() - t < 10 * 60 * 1000) return true; }catch(e){} }
  if(occupato() || document.querySelector(".modal")){ if(!forza) setTimeout(() => proponiApk(false), 60000); return true; }
  const auto = !!(A && A.installApk);
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h2>🔄 Aggiornamento disponibile</h2>
    <p style="margin:4px 0 8px;line-height:1.5">È disponibile una versione nuova dell'app. Un solo passaggio: dati e impostazioni restano.</p>
    <p class="muted" id="apkMsg" style="margin:0 0 8px">${auto ? "Premi <b>Aggiorna ora</b> e poi <b>Aggiorna</b> nella finestra di Android." : "Tocca <b>Scarica</b>, apri il file scaricato e scegli <b>Aggiorna</b>."}</p>
    <div class="btns"><button class="btn" id="apkDopo">Più tardi</button><button class="btn primary" id="apkOra">${auto ? "Aggiorna ora" : "⬇️ Scarica"}</button></div></div>`;
  document.body.appendChild(m);
  $("#apkDopo").onclick = () => { try{ localStorage.setItem("bc_apk_rinvio", todayISO()); }catch(e){} m.remove(); toast("Te lo ricordo domani."); };
  $("#apkOra").onclick = async () => {
    if(!auto){ m.remove(); location.href = APK_LINK; return; }
    const b = $("#apkOra"), msg = $("#apkMsg"); b.disabled = true; b.textContent = "⏳ Scarico…"; msg.textContent = "Scarico la nuova versione da GitHub (qualche secondo)…";
    try{
      try{ localStorage.setItem("bc_apk_tentato", String(Date.now())); }catch(e){}
      const r = await call("installApk");
      if(r === "permesso"){ msg.innerHTML = "Solo la prima volta: attiva <b>Consenti da questa fonte</b>, torna qui e premi di nuovo <b>Aggiorna ora</b>."; b.disabled = false; b.textContent = "Aggiorna ora"; return; }
      m.remove();
    }catch(e){ msg.textContent = e.message; b.disabled = false; b.textContent = "Riprova"; }
  };
  return true;
}
setTimeout(() => proponiApk(false), 4000);
if(A && A.setArchivio && archivioScelto()) A.setArchivio(archivioScelto());
/* Collegamento all'archivio: prima un controllo veloce (pallino verde subito),
   poi, solo se serve, l'aggiornamento dell'elenco in sottofondo. I documenti si scaricano quando li apri. */
let ultimoPing = 0;
const AGGIORNA_DOPO_MIN = 30;
async function collegaArchivio(forzaElenco){
  if(!archivioPronto()) return;
  const n = (await allBollette()).length;
  if(A.nasPing){
    if(nasState !== "on") setNasState("run");
    try{ await call("nasPing"); ultimoPing = Date.now(); setNasState("on"); }
    catch(e){ setNasState("off"); setSync(n ? "old" : "none"); return; }
  }
  const vecchio = Date.now() - Date.parse(settings().ultimoAggiornamento || 0) > AGGIORNA_DOPO_MIN * 60 * 1000;
  if(!vecchio && n) setSync("ok");
  if(forzaElenco || vecchio || !n){
    const ok = await refreshFromNas(true);
    if(ok && ["home","archivio","scadenze","grafici"].includes(current)) setView(current, currentArg, true);
  }else if(n && (await allBollette()).some(a => a.daCaricare)) uploadPending(true);
}
window.onAndroidResume = () => { if(archivioPronto() && Date.now() - ultimoPing > 5 * 60 * 1000) collegaArchivio(false); };
setNasState("unknown"); setSync(settings().ultimoAggiornamento ? "old" : "none");
setView(A && !archivioPronto() ? "impostazioni" : "home");
bozzaOp("readonly", st => st.get("corrente")).then(b => {
  if(!b || draft) return;
  draft = b; draft.pendingFiles = draft.pendingFiles || [];
  if(current === "home"){ setView("acquisisci"); toast("Ho ripreso la bolletta che stavi acquisendo."); }
}).finally(() => setTimeout(() => { riceviCondivisi(); azioneNotifica(); }, 300));
syncReminders();
if(archivioPronto()) collegaArchivio(false);

</script>
